[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Octane keeps the framework booted between requests. `--max-requests` recycles
; workers periodically, which bounds any leak a long-lived worker might accumulate.
[program:octane]
command=php /app/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8080 --max-requests=500
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; In the same container so single-service hosts (Railway, Render free tiers) work out
; of the box. Split these out once you scale horizontally.
[program:queue]
command=php /app/artisan queue:work --tries=3 --max-time=3600
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /app/artisan schedule:work
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Ships metrics to Nightwatch. Exits immediately without NIGHTWATCH_TOKEN, so
; supervisord is told not to keep retrying when monitoring is not configured.
[program:nightwatch]
command=php /app/artisan nightwatch:agent
autorestart=unexpected
startretries=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
