# Whole stack on one machine: Postgres + the Laravel API + the Next.js frontend.
#
#   cp backend/.env.example backend/.env      # then set APP_KEY (php artisan key:generate)
#   docker compose up --build
#
# API      -> http://localhost:8000
# Frontend -> http://localhost:3000

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phive
      POSTGRES_USER: phive
      POSTGRES_PASSWORD: phive
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phive -d phive"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: phive
      DB_USERNAME: phive
      DB_PASSWORD: phive
      LOG_CHANNEL: stderr
    env_file:
      - ./backend/.env
    ports:
      - "8000:8080"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    environment:
      # Container-to-container, so this is the service name — not localhost.
      API_URL: http://api:8080
    ports:
      - "3000:3000"

volumes:
  postgres-data:
